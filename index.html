<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>DUET – Digital Key Card Generator</title>
<style>
  :root {
    --bg: #14161a;
    --surface: #1e2127;
    --surface-2: #2a2e36;
    --text: #f2f3f5;
    --muted: #a0a6b1;
    --accent: #4cc27a;
    --danger: #ff7b72;
    --agent: #27864A;
    --assassin: #202124;
    --neutral: #E7D9BC;
    --radius: 14px;
    --gap: 6px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;            /* Fallback */
    min-height: 100dvh;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
  }
  [hidden] { display: none !important; }

  .screen {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex; flex-direction: column;
    width: 100%; max-width: 560px; margin: 0 auto;
    padding: calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
             calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  }

  /* ---------- Controls ---------- */
  button, input { font: inherit; color: inherit; }
  .btn {
    min-height: 48px; min-width: 44px; padding: 10px 16px;
    border: 0; border-radius: var(--radius);
    background: var(--surface-2); font-weight: 600; cursor: pointer;
    touch-action: manipulation;
  }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.primary { background: var(--accent); color: #07210f; font-size: 1.1rem; min-height: 56px; }
  .btn:focus-visible, input:focus-visible, .seg label:focus-within { outline: 3px solid #fff; outline-offset: 2px; }

  /* ---------- Setup ---------- */
  #setup { justify-content: center; gap: 22px; }
  h1 { margin: 0; font-size: 3.2rem; letter-spacing: .3em; padding-left: .3em; text-align: center; }
  .subtitle { margin: -14px 0 0; text-align: center; color: var(--muted); }
  .field { display: flex; flex-direction: column; gap: 8px; }
  .field > label, .field > .label { font-size: .85rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  input[type="text"] {
    width: 100%; min-height: 52px; padding: 12px 14px;
    background: var(--surface); border: 2px solid var(--surface-2); border-radius: var(--radius);
    font-size: 1.1rem; /* >=16px verhindert iOS-Zoom */ letter-spacing: .04em;
  }
  input[type="text"]:focus { border-color: var(--accent); outline: none; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px; background: var(--surface); border-radius: var(--radius); }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label {
    display: flex; align-items: center; justify-content: center; min-height: 52px;
    border-radius: 10px; font-weight: 700; cursor: pointer; color: var(--muted);
  }
  .seg input:checked + label { background: var(--accent); color: #07210f; }
  .seg input:checked + label::before { content: "✓ "; white-space: pre; }
  .error { color: var(--danger); min-height: 1.4em; margin: 0; font-size: .9rem; }

  #testPanel { background: var(--surface); border-radius: var(--radius); padding: 12px; font: .85rem/1.4 ui-monospace, monospace; white-space: pre-wrap; }

  /* ---------- Card view ---------- */
  #cardView { gap: 12px; }
  .card-head { text-align: center; }
  .player-label { margin: 0; font-size: 1.6rem; font-weight: 800; letter-spacing: .15em; }
  .seed-label { margin: 2px 0 0; color: var(--muted); font: .95rem ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
  .grid-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .grid {
    --size: min(100%, calc(100vh - 310px));
    --size: min(100%, calc(100dvh - 310px - env(safe-area-inset-top) - env(safe-area-inset-bottom)));
    width: max(var(--size), 220px); aspect-ratio: 1 / 1;
    display: grid; grid-template: repeat(5, 1fr) / repeat(5, 1fr); gap: var(--gap);
    transition: opacity .25s ease;
  }
  .grid.fading { opacity: 0; }
  .cell {
    border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-size: clamp(1.1rem, 7vw, 2.4rem); line-height: 1; user-select: none;
  }
  .cell.agent    { background: var(--agent);    color: #fff; }
  .cell.assassin { background: var(--assassin); color: #ff5a5a; box-shadow: inset 0 0 0 2px #5b5f66; font-weight: 800; }
  .cell.neutral  { background: var(--neutral);  color: #8a7b58; }
  .cell.covered  { background: var(--surface-2); }
  .cover-note { text-align: center; color: var(--muted); margin: 0; min-height: 1.4em; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: #fff; color: #111; padding: 10px 16px; border-radius: 999px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }

  /* ---------- Querformat / niedrige Bildschirme ---------- */
  @media (orientation: landscape) and (max-height: 520px) {
    #cardView { max-width: none; flex-direction: row; align-items: center; gap: 16px; }
    .grid-wrap { order: 2; flex: 0 0 auto; height: calc(100dvh - 32px); }
    .grid { --size: calc(100vh - 32px); --size: calc(100dvh - 32px); width: var(--size); }
    .side { order: 1; flex: 1; display: flex; flex-direction: column; gap: 12px; }
  }
  @media (min-width: 700px) { .grid { --gap: 8px; } }
  @media (prefers-reduced-motion: reduce) { .grid, .toast { transition: none; } }
</style>
</head>
<body>

<!-- ================= Setup ================= -->
<main id="setup" class="screen">
  <div>
    <h1>DUET</h1>
    <p class="subtitle">Digital Key Card Generator</p>
  </div>

  <div class="field">
    <label for="seedInput">Spiel-Seed</label>
    <input id="seedInput" type="text" placeholder="z. B. DUET-2026-ABC123"
           autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="go">
    <button id="genBtn" class="btn" type="button">🎲 Neuen Seed generieren</button>
  </div>

  <div class="field" role="radiogroup" aria-labelledby="playerLabel">
    <span class="label" id="playerLabel">Spieler</span>
    <div class="seg">
      <input type="radio" name="player" id="playerA" value="A" checked><label for="playerA">Spieler A</label>
      <input type="radio" name="player" id="playerB" value="B"><label for="playerB">Spieler B</label>
    </div>
  </div>

  <div>
    <button id="showBtn" class="btn primary" type="button" style="width:100%" disabled>Codekarte anzeigen</button>
    <p id="setupError" class="error" role="alert"></p>
  </div>

  <pre id="testPanel" hidden></pre>
</main>

<!-- ================= Codekarte ================= -->
<main id="cardView" class="screen" hidden>
  <div class="side">
    <div class="card-head">
      <h2 id="playerLabelCard" class="player-label">SPIELER A</h2>
      <p id="seedLabelCard" class="seed-label"></p>
    </div>
  </div>
  <div class="grid-wrap"><div id="grid" class="grid" role="group" aria-label="Codekarte"></div></div>
  <div class="side">
    <p id="coverNote" class="cover-note"></p>
    <div class="actions">
      <button id="copyBtn" class="btn" type="button">📋 Seed kopieren</button>
      <button id="toggleBtn" class="btn" type="button">🙈 Karte verbergen</button>
      <button id="switchBtn" class="btn" type="button">🔁 Perspektive wechseln</button>
      <button id="newBtn" class="btn" type="button">🎲 Neue Mission</button>
    </div>
    <button id="backBtn" class="btn" type="button" style="width:100%;margin-top:8px;background:transparent;color:var(--muted)">← Zurück zum Setup</button>
  </div>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
/*
 * DUET – Digital Key Card Generator
 * ---------------------------------------------------------------------------
 * ALGORITHMUS (deterministisch, ohne Server)
 *  1. normalizeSeed: Unicode NFKC, Grossbuchstaben, alle Zeichen ausser Buchstaben/Ziffern
 *     entfernen, dann in 4er-Gruppen mit "-" trennen (DUET-8K4M-P7X2-Q9LW).
 *     => Eingabe mit/ohne Bindestriche, Leerzeichen oder Kleinschreibung ergibt denselben
 *     Seed. Die Funktion ist idempotent (wird auch live beim Tippen/Einfügen verwendet).
 *  2. hashSeed: FNV-1a (32 Bit) über die UTF-16-Codeeinheiten, danach murmur3-Finalizer
 *     (Avalanche). Nur 32-Bit-Integer-Arithmetik (Math.imul, >>> 0) => browserunabhängig.
 *  3. createPRNG: Mulberry32. Gleicher Hash => gleiche Zahlenfolge in [0,1).
 *  4. generateMission: Die 25 gemeinsamen Kategorien (Paare "Farbe A / Farbe B") laut
 *     Duett-Tabelle werden mit Fisher-Yates und dem PRNG gemischt; Position i erhält
 *     Kategorie i. Die Rolle (A/B) fliesst NICHT in die Generierung ein.
 *  5. getPlayerPerspective: Projiziert die gemeinsame Mission auf Seite A oder B.
 *
 * Codes: G = Agent (grün), X = Attentäter (schwarz), N = neutral.
 * Eine Zelle ist ein 2-Zeichen-String: erstes Zeichen = Seite A, zweites = Seite B.
 *
 * ENTSCHEIDUNGEN: Die Karte wird beim Wechsel der Perspektive, beim Verlassen des Tabs
 * und bei "Verbergen" aus dem DOM geleert (nur neutrale Platzhalter). Nichts wird in
 * localStorage/URL/Logs geschrieben. Testmodus: index.html?test=1
 */
(function () {
  "use strict";

  // ======================= Generator (UI-unabhängig) =======================

  // Gemeinsame Kategorien laut Spezifikation (Summe = 25).
  var CATEGORY_COUNTS = [
    ["GG", 3], ["GX", 1], ["XG", 1], ["GN", 5], ["NG", 5],
    ["XX", 1], ["XN", 1], ["NX", 1], ["NN", 7]
  ];
  var CELL_COUNT = 25;

  function normalizeSeed(seed) {
    var compact = String(seed == null ? "" : seed).normalize("NFKC").toUpperCase().replace(/[^\p{L}\p{N}]/gu, "");
    return compact.replace(/(.{4})(?=.)/gu, "$1-");
  }

  // FNV-1a 32 Bit + murmur3-fmix32
  function hashSeed(seed) {
    var h = 0x811c9dc5;
    var s = normalizeSeed(seed);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b);
    h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35);
    h ^= h >>> 16;
    return h >>> 0;
  }

  // Mulberry32: liefert eine Funktion, die bei jedem Aufruf eine Zahl in [0,1) zurückgibt.
  function createPRNG(seed) {
    var a = hashSeed(seed);
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Fisher-Yates; gibt eine gemischte Kopie zurück.
  function shuffle(array, random) {
    var result = array.slice();
    for (var i = result.length - 1; i > 0; i--) {
      var j = Math.floor(random() * (i + 1));
      var tmp = result[i]; result[i] = result[j]; result[j] = tmp;
    }
    return result;
  }

  // Erzeugt IMMER die vollständige gemeinsame Mission – unabhängig von der Spielerrolle.
  function generateMission(seed) {
    var normalized = normalizeSeed(seed);
    var categories = [];
    CATEGORY_COUNTS.forEach(function (entry) {
      for (var i = 0; i < entry[1]; i++) categories.push(entry[0]);
    });
    return { seed: normalized, cells: shuffle(categories, createPRNG(normalized)) };
  }

  // Seite "A" oder "B" als Array aus 25 Codes (G/X/N).
  function getPlayerPerspective(mission, player) {
    var index;
    if (player === "A") index = 0;
    else if (player === "B") index = 1;
    else throw new Error("Unbekannter Spieler: " + player);
    return mission.cells.map(function (cell) { return cell.charAt(index); });
  }

  function countBy(list, key) {
    var n = 0;
    for (var i = 0; i < list.length; i++) if (key(list[i])) n++;
    return n;
  }

  // Prüft eine Mission gegen alle Struktur-Regeln (Tests 1–14). Gibt {ok, errors} zurück.
  function validateMission(mission) {
    var errors = [];
    var cells = mission && mission.cells;
    if (!Array.isArray(cells) || cells.length !== CELL_COUNT) {
      return { ok: false, errors: ["Anzahl Positionen != 25"] };
    }
    if (!cells.every(function (c) { return /^[GXN]{2}$/.test(c); })) {
      return { ok: false, errors: ["Ungültiger Zellcode"] };
    }
    function expect(label, actual, wanted) {
      if (actual !== wanted) errors.push(label + ": " + actual + " statt " + wanted);
    }
    ["A", "B"].forEach(function (p, idx) {
      var side = getPlayerPerspective(mission, p);
      expect(p + " grün",    countBy(side, function (c) { return c === "G"; }), 9);
      expect(p + " schwarz", countBy(side, function (c) { return c === "X"; }), 3);
      expect(p + " neutral", countBy(side, function (c) { return c === "N"; }), 13);
    });
    function pair(code) { return countBy(cells, function (c) { return c === code; }); }
    expect("beidseitig grün",    pair("GG"), 3);
    expect("beidseitig schwarz", pair("XX"), 1);
    expect("A schwarz / B grün", pair("XG"), 1);
    expect("B schwarz / A grün", pair("GX"), 1);
    expect("A schwarz / B neutral", pair("XN"), 1);
    expect("B schwarz / A neutral", pair("NX"), 1);
    expect("unterschiedliche grüne Positionen",
      countBy(cells, function (c) { return c.indexOf("G") !== -1; }), 15);
    return { ok: errors.length === 0, errors: errors };
  }

  function generateRandomSeed() {
    // 32 Zeichen ohne verwechselbare Zeichen (0/O, 1/I); 256 % 32 == 0 => kein Modulo-Bias.
    var alphabet = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
    var bytes = new Uint8Array(12);
    crypto.getRandomValues(bytes);
    var chars = Array.prototype.map.call(bytes, function (b) { return alphabet.charAt(b % 32); }).join("");
    return "DUET-" + chars.slice(0, 4) + "-" + chars.slice(4, 8) + "-" + chars.slice(8, 12);
  }

  // Testmodus (Tests 1–17) über `count` Seeds. Rein funktional, ohne UI.
  function runSelfTest(count) {
    count = count || 10000;
    var failures = [];
    var seen = Object.create(null);
    var distinct = 0;
    for (var i = 0; i < count; i++) {
      var seed = generateRandomSeed();
      var m1 = generateMission(seed);
      var v = validateMission(m1);
      if (!v.ok) failures.push(seed + ": " + v.errors.join("; "));

      // Test 15: gleiche Eingabe (auch mit Leerzeichen/Kleinschreibung) => identische Karte
      var m2 = generateMission("  " + seed.toLowerCase().replace(/-/g, "") + " ");
      if (m1.cells.join() !== m2.cells.join()) failures.push(seed + ": nicht reproduzierbar");

      // Test 16: A- und B-Seite sind Projektionen derselben Mission
      var a = getPlayerPerspective(m1, "A"), b = getPlayerPerspective(m1, "B");
      for (var k = 0; k < CELL_COUNT; k++) {
        if (a[k] + b[k] !== m1.cells[k]) { failures.push(seed + ": Perspektiven passen nicht"); break; }
      }

      var key = m1.cells.join("");
      if (!seen[key]) { seen[key] = 1; distinct++; }
    }
    // Test 17: Unterschiedliche Seeds => (praktisch) unterschiedliche Karten
    var distinctRatio = distinct / count;
    if (distinctRatio < 0.999) failures.push("Zu viele identische Karten: " + (distinctRatio * 100).toFixed(2) + " % eindeutig");
    // Golden Value: schützt vor Abweichungen zwischen Browsern/Versionen
    var golden = generateMission("DUET-GOLDEN-1").cells.join(" ");
    if (golden !== GOLDEN_EXPECTED) failures.push("Golden-Test abweichend: " + golden);
    return { ok: failures.length === 0, checked: count, distinctRatio: distinctRatio, failures: failures.slice(0, 20), failureCount: failures.length };
  }
  var GOLDEN_EXPECTED = "NN GG NN NN NG GN NG GX GG GN NN NX NN NN XX NN XG NG GN NG GG GN XN NG GN";

  // ======================= UI =======================
  var api = {
    normalizeSeed: normalizeSeed, hashSeed: hashSeed, createPRNG: createPRNG, shuffle: shuffle,
    generateMission: generateMission, getPlayerPerspective: getPlayerPerspective,
    validateMission: validateMission, generateRandomSeed: generateRandomSeed, runSelfTest: runSelfTest
  };
  if (typeof document === "undefined") {           // Node-Tests
    if (typeof module !== "undefined") module.exports = api;
    return;
  }

  var SYMBOLS = { G: "●", X: "✕", N: "·" };
  var CLASSES = { G: "agent", X: "assassin", N: "neutral" };
  var LABELS  = { G: "Agent", X: "Attentäter", N: "Neutral" };

  function $(id) { return document.getElementById(id); }
  var els = {
    setup: $("setup"), cardView: $("cardView"), seed: $("seedInput"), gen: $("genBtn"), show: $("showBtn"),
    err: $("setupError"), grid: $("grid"), playerLabel: $("playerLabelCard"), seedLabel: $("seedLabelCard"),
    note: $("coverNote"), toggle: $("toggleBtn"), toast: $("toast"), test: $("testPanel")
  };
  // Zustand: Mission wird im Speicher gehalten, aber nur die aktive Perspektive wird gerendert.
  var state = { mission: null, player: "A", revealed: false };

  // Baut die sichtbare Karte der gewählten Perspektive.
  function renderCard(mission, player) {
    var side = getPlayerPerspective(mission, player);
    var frag = document.createDocumentFragment();
    side.forEach(function (code, i) {
      var cell = document.createElement("div");
      cell.className = "cell " + CLASSES[code];
      cell.setAttribute("role", "img");
      cell.setAttribute("aria-label", "Reihe " + (Math.floor(i / 5) + 1) + ", Spalte " + (i % 5 + 1) + ": " + LABELS[code]);
      cell.textContent = SYMBOLS[code];
      frag.appendChild(cell);
    });
    return frag;
  }

  // Verdeckte Karte: 25 identische Platzhalter, keinerlei Information.
  function renderHiddenCard() {
    var frag = document.createDocumentFragment();
    for (var i = 0; i < CELL_COUNT; i++) {
      var cell = document.createElement("div");
      cell.className = "cell covered";
      cell.setAttribute("aria-hidden", "true");
      frag.appendChild(cell);
    }
    return frag;
  }

  function paint() {
    els.playerLabel.textContent = "SPIELER " + state.player;
    els.seedLabel.textContent = state.mission.seed;
    els.grid.replaceChildren(state.revealed ? renderCard(state.mission, state.player) : renderHiddenCard());
    els.grid.setAttribute("aria-label", state.revealed ? "Codekarte Spieler " + state.player : "Codekarte verborgen");
    els.toggle.textContent = state.revealed ? "🙈 Karte verbergen" : "👁 Karte aufdecken";
    els.note.textContent = state.revealed ? "" : "Karte verborgen";
  }

  function hideNow() {                                // synchron, ohne Animation (Privatsphäre)
    if (!state.mission) return;
    state.revealed = false;
    els.grid.classList.remove("fading");
    paint();
  }

  function selectedPlayer() { return document.querySelector('input[name="player"]:checked').value; }
  function setPlayer(p) { $("player" + p).checked = true; }

  function updateShowButton() {
    var ok = normalizeSeed(els.seed.value) !== "";
    els.show.disabled = !ok;
    if (ok) els.err.textContent = "";
  }

  function toast(msg) {
    els.toast.textContent = msg; els.toast.classList.add("show");
    clearTimeout(toast.t); toast.t = setTimeout(function () { els.toast.classList.remove("show"); }, 1600);
  }

  function openCard(seed, player) {
    var mission = generateMission(seed);
    var check = validateMission(mission);
    if (!check.ok) { els.err.textContent = "Interner Fehler bei der Kartengenerierung."; return; }
    state.mission = mission; state.player = player; state.revealed = true;
    els.setup.hidden = true; els.cardView.hidden = false;
    paint();
    window.scrollTo(0, 0);
  }

  function closeCard() {
    state.mission = null; state.revealed = false;
    els.grid.replaceChildren();
    els.cardView.hidden = true; els.setup.hidden = false;
    els.seed.focus();
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {   // Fallback für file:// und ältere Browser
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", "");
      ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;font-size:16px";
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { /* ignorieren */ }
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error("copy failed"));
    });
  }

  // --- Events ---
  // Seed live formatieren (Bindestriche automatisch, Paste mit/ohne "-"); Cursorposition bleibt erhalten.
  els.seed.addEventListener("input", function () {
    var el = els.seed;
    var caret = el.selectionStart == null ? el.value.length : el.selectionStart;
    var significant = normalizeSeed(el.value.slice(0, caret)).replace(/-/g, "").length;
    var formatted = normalizeSeed(el.value);
    if (formatted !== el.value) {
      el.value = formatted;
      var pos = 0, seen = 0;
      while (pos < formatted.length && seen < significant) { if (formatted.charAt(pos) !== "-") seen++; pos++; }
      try { el.setSelectionRange(pos, pos); } catch (e) { /* ignorieren */ }
    }
    updateShowButton();
  });
  els.seed.addEventListener("keydown", function (e) { if (e.key === "Enter" && !els.show.disabled) els.show.click(); });
  els.gen.addEventListener("click", function () { els.seed.value = generateRandomSeed(); updateShowButton(); });
  els.show.addEventListener("click", function () {
    var seed = normalizeSeed(els.seed.value);
    if (!seed) { els.err.textContent = "Bitte einen Seed eingeben."; return; }
    els.seed.value = seed;
    openCard(seed, selectedPlayer());
  });
  $("copyBtn").addEventListener("click", function () {
    copyText(state.mission.seed).then(function () { toast("Seed kopiert"); },
                                      function () { toast("Kopieren nicht möglich"); });
  });
  els.toggle.addEventListener("click", function () { state.revealed ? hideNow() : (state.revealed = true, paint()); });
  $("switchBtn").addEventListener("click", function () {
    // Erst verbergen, dann Perspektive wechseln; Aufdecken nur per expliziter Aktion.
    hideNow();
    state.player = state.player === "A" ? "B" : "A";
    setPlayer(state.player);
    paint();
  });
  $("newBtn").addEventListener("click", function () {
    var seed = generateRandomSeed();
    els.seed.value = seed;
    openCard(seed, state.player);
    toast("Neue Mission: " + seed);
  });
  $("backBtn").addEventListener("click", closeCard);
  // Karte automatisch verbergen, wenn die App in den Hintergrund geht.
  document.addEventListener("visibilitychange", function () { if (document.hidden) hideNow(); });
  window.addEventListener("pagehide", hideNow);

  // --- Start: URL-Parameter übernehmen (nur Seed + Rolle, keine Karteninfo) ---
  var params = new URLSearchParams(location.search);
  if (params.get("seed")) els.seed.value = normalizeSeed(params.get("seed"));
  var p = (params.get("player") || "").toUpperCase();
  if (p === "A" || p === "B") setPlayer(p);
  updateShowButton();

  if (params.has("test")) {
    els.test.hidden = false;
    els.test.textContent = "Test läuft …";
    setTimeout(function () {
      var t0 = performance.now();
      var r = runSelfTest(10000);
      els.test.textContent = (r.ok ? "✅ OK" : "❌ FEHLER") + " – " + r.checked + " Seeds, " +
        (r.distinctRatio * 100).toFixed(2) + " % eindeutig, " + Math.round(performance.now() - t0) + " ms" +
        (r.ok ? "" : "\n" + r.failures.join("\n"));
    }, 30);
  }
})();
</script>
</body>
</html>
